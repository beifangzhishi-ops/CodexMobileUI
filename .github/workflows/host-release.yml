name: Build Host-only release
on:
  push:
    tags:
      - 'host-v*'

permissions:
  contents: write

jobs:
  windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck:gateway
      - run: npm run build:gateway
      - name: Create host-only bundle and checksums
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          ./scripts/package-mobile-host.ps1 -OutputDirectory ".tmp/host-release-$tag"
          $file = ".tmp/CodexMobileHost-$tag.zip"
          Compress-Archive -Path ".tmp/host-release-$tag/*" -DestinationPath $file -CompressionLevel Optimal
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $file -Leaf)" | Set-Content -Path "$file.sha256" -Encoding ascii
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          gh release create $tag ".tmp/CodexMobileHost-$tag.zip" ".tmp/CodexMobileHost-$tag.zip.sha256" --verify-tag --title $tag --notes "Host-only release built on GitHub from this immutable tag. Verify both the ZIP digest and embedded manifest before deployment."
