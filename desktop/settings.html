<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; form-action 'none'">
<title>桌面端连接设置</title><style>
:root{font:14px "Segoe UI","Microsoft YaHei",sans-serif;color-scheme:dark}
body{margin:0;background:#151515;color:#e9e9e9;padding:25px 28px}
h1{font-size:19px;font-weight:600;margin:0 0 10px}p{color:#aaa;font-size:12px;line-height:1.6;margin:0 0 18px}
form{display:grid;gap:13px}label{display:grid;gap:6px;font-size:12px;color:#c7c7c7}
input,select{width:100%;min-height:38px;box-sizing:border-box;border:1px solid #484848;border-radius:7px;background:#2b2b2b;color:#f2f2f2;padding:8px 10px;font:inherit}
input:focus,select:focus{outline:2px solid #417de8;outline-offset:1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.section{border-top:1px solid #333;padding-top:14px;margin-top:2px}
strong{font-weight:600}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:7px}
button{border:1px solid #444;border-radius:8px;padding:10px 17px;color:#eee;background:#2b2b2b;cursor:pointer}
button.primary{background:#2868d3;border-color:#2868d3}button:disabled{opacity:.6;cursor:default}
#error{color:#ed9999;min-height:15px;font-size:12px;overflow-wrap:anywhere}
</style></head><body><h1>连接设置</h1><p>桌面端只是客户端。会话、工具与权限继续由 6v / noha 各自的 Codex App Server 管理。</p>
<form id="form"><label>Web Coordinator 内网地址<input id="serverUrl" spellcheck="false" required placeholder="https://设备名.Tailnet.ts.net:4190/"></label>
<label>本机是哪台电脑<select id="localHost"><option value="6v">6v</option><option value="noha">noha</option></select></label>
<div class="section"><strong>远程文件定位</strong><p>使用机器的 Tailnet IP；按 C$ / D$ 等磁盘共享尝试定位。可选 SMB 共享名只用于 C 盘，访问前会验证文件实际存在。</p>
<div class="grid"><label>6v IP<input id="ip6v" required spellcheck="false"></label><label>6v C盘共享名<input id="share6v" spellcheck="false"></label>
<label>noha IP<input id="ipnoha" required spellcheck="false"></label><label>noha C盘共享名<input id="sharenoha" spellcheck="false"></label></div></div>
<div id="error" role="status"></div><div class="actions"><button type="button" id="cancel">取消</button><button class="primary" type="submit" id="save">保存并应用</button></div></form>
<script src="settings-view.js"></script></body></html>
