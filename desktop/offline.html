<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodexMobile · 连接中断</title>
<style>
body { margin:0; min-height:100vh; background:#101010; color:#eee; font:14px "Segoe UI","Microsoft YaHei",sans-serif; }
header { box-sizing:border-box; height:48px; display:flex; align-items:center; gap:18px; padding:0 145px 0 16px; background:#202225; -webkit-app-region:drag; user-select:none; }
header strong { font-size:16px; white-space:nowrap; }
nav { display:flex; gap:5px; -webkit-app-region:no-drag; }
nav button { height:36px; padding:0 12px; font-size:15px; margin:0; border:0; border-radius:7px; background:transparent; color:#e1e1e1; cursor:pointer; }
nav button:hover { background:#35373b; }
main { min-height:calc(100vh - 48px); box-sizing:border-box; max-width:430px; margin:auto; padding:32px; display:flex; flex-direction:column; justify-content:center; text-align:center; }
h1 { font-size:20px; font-weight:600; }
p { color:#a4a4a4; line-height:1.8; }
.actions { display:flex; justify-content:center; gap:10px; }
.actions button { margin:12px 0; padding:11px 20px; border-radius:8px; border:1px solid #484848; background:#292929; color:#fff; cursor:pointer; }
.actions button:hover { background:#383838; }
</style>
</head>
<body>
<header><strong>▣ CodexMobile</strong><nav>
<button type="button" data-menu="file">文件</button>
<button type="button" data-menu="edit">编辑</button>
<button type="button" data-menu="view">视图</button>
<button type="button" data-menu="window">窗口</button>
</nav></header>
<main>
<h1>当前无法连接到工作台</h1>
<p>对话仍保存在各电脑的 Codex 服务端。检查内网连接，或修改 Coordinator 地址。</p>
<div class="actions"><button id="retry">重新连接</button><button id="settings">连接设置</button></div>
</main>
<script>
document.getElementById('retry').addEventListener('click', () => window.desktopOffline.retry());
document.getElementById('settings').addEventListener('click', () => window.desktopOffline.settings());
document.querySelectorAll('[data-menu]').forEach(button => button.addEventListener('click', () => {
  const r = button.getBoundingClientRect();
  window.desktopOffline.openMenu(button.dataset.menu, r.left, r.bottom);
}));
</script>
</body></html>
